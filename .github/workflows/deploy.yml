# GitHub Pages 배포: main 브랜치에 올리면 테스트 → 빌드 → 배포
# 저장소 Settings › Pages › Source 를 "GitHub Actions"로 한 번 설정해야 한다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # 실서비스 공개 전: 저장소 Settings › Variables 에서 STRICT_APPROVAL=true 로 바꾸면
          # 감수 약사 승인이 없는 문구는 화면에 나오지 않는다.
          VITE_STRICT_APPROVAL: ${{ vars.STRICT_APPROVAL || 'false' }}
          VITE_OCR_URL: ${{ vars.OCR_URL || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      # 같은 빌드를 Cloudflare Pages(https://yaksok.pages.dev)에도 올린다.
      # 저장소 Secrets 에 CLOUDFLARE_API_TOKEN (권한: Cloudflare Pages 편집)이 있을 때만 한다.
      - id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "CLOUDFLARE_API_TOKEN 이 없어 Cloudflare 배포는 건너뜀"; fi
      - name: Cloudflare Pages 배포
        if: steps.cf.outputs.on == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.1 pages deploy dist --project-name yaksok --branch main --commit-dirty=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
